
name: Learn Korean Android Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Learn Korean APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Check Gradle
        run: gradle --version

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Check Release Signing Secrets
        id: signing
        working-directory: .
        shell: bash
        run: |
          if [ -n "$KEYSTORE_BASE64" ] &&
             [ -n "$KEYSTORE_PASSWORD" ] &&
             [ -n "$KEY_ALIAS" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are not configured. Skipping release APK."
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

      - name: Restore Release Keystore
        if: steps.signing.outputs.available == 'true'
        working-directory: android
        shell: bash
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/learnkorean-release.jks
          test -s app/learnkorean-release.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build Signed Release APK
        if: steps.signing.outputs.available == 'true'
        working-directory: android
        run: gradle assembleRelease --stacktrace
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Learn-Korean-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Release APK
        if: success() && steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Learn-Korean-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
          
