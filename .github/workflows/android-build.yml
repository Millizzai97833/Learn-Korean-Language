name: Android CI/CD Build & Package

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew || (cd android && chmod +x ./gradlew)

      - name: Run Unit Tests
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew testDebugUnitTest --stacktrace
          elif [ -f "./android/gradlew" ]; then
            cd android && ./gradlew testDebugUnitTest --stacktrace
          fi

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          elif [ -f "./android/gradlew" ]; then
            cd android && ./gradlew assembleDebug --stacktrace
          fi

      - name: Build Release APK (Unsigned / Signed)
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease --stacktrace || true
          elif [ -f "./android/gradlew" ]; then
            cd android && ./gradlew assembleRelease --stacktrace || true
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: learn-korean-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Release APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learn-korean-release-apk
          path: |
            **/build/outputs/apk/release/*.apk
            **/build/outputs/bundle/release/*.aab
          retention-days: 30
